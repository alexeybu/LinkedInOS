<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
</style>
</head>
<body>
<div style="width:1080px;height:1080px;background:oklch(0.965 0.012 75);display:flex;flex-direction:column;padding:80px 80px;font-family:'IBM Plex Sans', system-ui, sans-serif;">

  <div style="display:flex;align-items:center;justify-content:flex-end;">
    <div style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-weight:600;font-size:17px;letter-spacing:0.04em;color:oklch(0.4 0.03 50 / 0.55);">__SLIDE_INDEX__ / __SLIDE_TOTAL__</div>
  </div>

  <div style="margin-top:56px;max-width:900px;">
    <p style="margin:0 0 48px 0;font-family:'Sora', system-ui, sans-serif;font-weight:700;font-size:__HEADLINE_SIZE__px;line-height:1.2;letter-spacing:-0.01em;color:oklch(0.18 0.02 50);text-wrap:pretty;">
      __HEADLINE__
    </p>
    <p style="margin:0;font-family:'IBM Plex Sans', system-ui, sans-serif;font-weight:400;font-size:__BODY_SIZE__px;line-height:1.52;color:oklch(0.32 0.02 50 / 0.88);text-wrap:pretty;">
      __BODY__
    </p>
  </div>

  <div style="flex:1;display:flex;align-items:center;justify-content:center;">
    <svg width="0" height="0">
      <defs>
        <filter id="sketchy" x="-30%" y="-30%" width="160%" height="160%">
          <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="5"/>
        </filter>
      </defs>
    </svg>
    __DIAGRAM__
  </div>

  <div style="display:flex;align-items:center;gap:14px;">
    <div style="width:36px;height:3px;background:#a9702c;border-radius:2px;"></div>
    <div style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-weight:500;font-size:15px;letter-spacing:0.03em;color:oklch(0.4 0.03 50 / 0.55);">__FOOTER__</div>
  </div>

</div>
</body>
</html>
